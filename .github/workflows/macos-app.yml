# Builds the macOS app for every pull request, checks the built app answers, and keeps the .dmg as a
# download (the run's Artifacts) for trying a change on a Mac, the way windows-installer.yml does for
# Windows.
#
# Apart from ci.yml on purpose: a release build takes a while, and the release workflows wait for
# CI, so a slow build never holds up a release. release.yml builds the real app the same way in
# build-macos. The app is not signed, so macOS asks once (right-click, Open).
name: macOS app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older app useless.
concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build, check and keep the macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same universal build (Apple Silicon and Intel) as build-macos in release.yml.
      - name: Build the app
        run: bun run tauri build --target universal-apple-darwin

      # Both architectures are in the binary, and the command line tool inside the app answers.
      # Exit code 2 with "not running" is right: the app is built but not started.
      - name: Check the built app
        timeout-minutes: 5
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Git Manager.app"
          binary="$app/Contents/MacOS/git-manager"
          archs="$(lipo -archs "$binary")"
          echo "Architectures: $archs"
          if [[ "$archs" != *arm64* || "$archs" != *x86_64* ]]; then
            echo "::error::the app is not universal: $archs"
            exit 1
          fi
          set +e
          output="$("$binary" cli status 2>&1)"
          code=$?
          set -e
          echo "$output"
          if [ "$code" != "2" ] || ! echo "$output" | grep -q "not running"; then
            echo "::error::git-manager cli status answered $code instead of 2 and \"not running\""
            exit 1
          fi

      - name: Keep the app
        uses: actions/upload-artifact@v4
        with:
          name: git-manager-macos-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error
