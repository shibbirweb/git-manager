name: Feature request
description: Suggest an idea or an improvement for Git Manager.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow this is about.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: What you would like to see. Screenshots from other tools are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
