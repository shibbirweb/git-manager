# Git Manager Native, the SwiftUI experiment (swiftui/, docs/plans/swiftui-experiment.md): builds the app
# and runs its tests on pull requests that touch it or the backend files its bridge shares with the
# current app. Separate from ci.yml, so the current app's checks and releases never depend on it.

name: Native app (SwiftUI)

on:
  pull_request:
    paths:
      - "swiftui/**"
      - ".github/workflows/native.yml"
      # Included by path in swiftui/bridge/src/lib.rs: a change there can break the bridge.
      - "src-tauri/src/git/**"
      - "src-tauri/src/merge/**"
      - "src-tauri/src/error.rs"
      - "src-tauri/src/paths.rs"
      - "src-tauri/src/askpass.rs"
      - "src-tauri/src/git_console.rs"
      - "src-tauri/src/child_process.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native app (build + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: swiftui/bridge

      - name: Bridge clippy
        working-directory: swiftui/bridge
        run: cargo clippy --locked --lib --examples --tests -- -D warnings

      - name: Bridge tests
        working-directory: swiftui/bridge
        run: cargo test --locked

      # The Rust bridge, the Swift app and the .app bundle (also needed by the Swift tests' build).
      - name: Build the app
        run: swiftui/scripts/build-app.sh

      - name: Swift tests (gm-measure)
        run: swiftui/scripts/test.sh

      # Starts the built app on a test repository and checks every control tool end to end.
      - name: Smoke test
        working-directory: swiftui
        run: swift run -c release gm-measure smoke

      - name: Package the app
        run: ditto -c -k --keepParent "swiftui/build/Git Manager Native.app" swiftui/build/GitManagerNative.zip

      - uses: actions/upload-artifact@v4
        with:
          name: git-manager-native
          path: swiftui/build/GitManagerNative.zip
          retention-days: 14
